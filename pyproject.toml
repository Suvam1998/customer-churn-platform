[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-platform"
version = "0.1.0"
description = "Real-Time Customer Churn Prediction & Intelligent Retention Platform (M.Tech capstone)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "M.Tech AI & Data Science Capstone" }]

[tool.setuptools]
packages = ["src", "api"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src", "api"]
omit = ["tests/*"]
